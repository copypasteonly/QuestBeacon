[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "questbeacon-db"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["lupa==2.5"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
questbeacon-db = "questbeacon_db.cli:main"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["questbeacon_db*"]

